[package]
name = "raztec"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "raztec"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[features]
python = ["pyo3"]

[dev-dependencies]
image = "0.24.2"
show-image = "0.12.1"
